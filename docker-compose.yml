# Local-only compose for building/testing the image.
#
# On your production server, write your own compose: pull the image from GHCR
# (ghcr.io/ldesfontaine/termfolio:<tag>), wire your Traefik labels / auth /
# network as you see fit, and mount the same volumes (portfolio-data, portfolio-media).
services:
  portfolio:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-http://localhost:3000}
    image: portfolio:latest
    container_name: portfolio
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      DATABASE_URI: file:/data/payload.db
      SITE_URL: ${SITE_URL:-http://localhost:3000}
    volumes:
      - portfolio-data:/data
      - portfolio-media:/app/media

volumes:
  portfolio-data:
  portfolio-media:
