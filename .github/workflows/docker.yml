name: Build & Push Docker Image

on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write    # Requis pour cosign keyless (signing OIDC)
    timeout-minutes: 15  # Garde-fou : un build amd64 prend ~4-5 min normalement.

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraire le tag
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=

      # Build amd64 only. Ajouter arm64 (Apple Silicon / Pi) demanderait un runner
      # arm64 natif (`ubuntu-24.04-arm`) plutôt que QEMU — l'émulation prenait
      # ~25 min et amplifiait la fenêtre d'erreurs GHCR transitoires (502).
      - name: Build et push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false  # Évite le second manifest "attestation" qui double les uploads.

      - name: Installer cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Signer l'image
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          IMAGE="ghcr.io/${IMAGE_NAME,,}"    # ${VAR,,} = lowercase en bash
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}" --format '{{.Manifest.Digest}}')
          cosign sign --yes "${IMAGE}@${DIGEST}"
